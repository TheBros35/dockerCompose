# We overwrite the package's default conf.d/ssl.conf, so load the
# modules ourselves instead of relying on what that file used to do.
LoadModule ssl_module modules/mod_ssl.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so

# Apache listens on 8443 for HTTPS since HAProxy already owns 80/443
# in this same container's network namespace.
Listen 8443

<VirtualHost *:8443>
    ServerName localhost
    DocumentRoot /var/www/localhost/htdocs

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/cert.crt
    SSLCertificateKeyFile /etc/apache2/ssl/key.key
    # If your CA gives you a separate chain/intermediate bundle, uncomment:
    # SSLCertificateChainFile /etc/apache2/ssl/chain.pem

    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5

    <Directory /var/www/localhost/htdocs>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>