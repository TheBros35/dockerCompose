global
    log stdout format raw local0

defaults
    log     global
    mode    http
    timeout connect 5s
    timeout client  50s
    timeout server  50s

frontend http_front
    bind *:80
    default_backend web_servers

backend web_servers
    balance roundrobin
    # uncomment the below line if you want to use sticky sessions
    # cookie SRVID insert indirect nocache
    # If using Docker networks, you can route directly to container names
    server web_app_1 web-node1:80 check cookie web-node1
    server web_app_2 web-node2:80 check cookie web-node2
