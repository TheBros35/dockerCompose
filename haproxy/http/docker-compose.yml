services:
  haproxy:
    image: haproxy:alpine
    container_name: haproxy_lb
    ports:
      - "80:80"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - web-node1
      - web-node2

  web-node1:
    image: nginx:alpine
    volumes:
    - ./html1:/usr/share/nginx/html:ro
    environment:
    - NGINX_PORT=80

  web-node2:
    image: nginx:alpine
    volumes:
    - ./html2:/usr/share/nginx/html:ro
    environment:
    - NGINX_PORT=80
