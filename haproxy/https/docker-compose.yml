services:
  haproxy:
    image: haproxy:alpine
    container_name: haproxy_lb
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./lb.pem:/usr/local/etc/haproxy/certs/lb.pem:ro
    depends_on:
      - web-node1
      - web-node2

  web-node1:
    image: nginx:alpine
    volumes:
    - ./html1:/usr/share/nginx/html:ro
    - ./certs1:/etc/nginx/certs:ro
    - ./nginx1.conf:/etc/nginx/conf.d/default.conf:ro

  web-node2:
    image: nginx:alpine
    volumes:
    - ./html2:/usr/share/nginx/html:ro
    - ./certs2:/etc/nginx/certs:ro
    - ./nginx2.conf:/etc/nginx/conf.d/default.conf:ro
